[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-continue-hook"
version = "1.3.0"
description = "Hermes Agent plugin: stop asking permission for things the agent should just do"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["hermes", "hermes-agent", "plugin", "agent", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ttxs69/hermes-continue-hook"
Issues = "https://github.com/ttxs69/hermes-continue-hook/issues"

[tool.setuptools]
py-modules = ["detector", "hookctl"]

[tool.setuptools.package-data]
"*" = ["plugin.yaml", "patch-mode/*", "agent-hooks/*", "adapters/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["adapters/dsh", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "E501",    # long lines are handled by the formatter
  "SIM105",  # contextlib.suppress is slower than try/except here
  "B008",
  # The trigger patterns are Chinese by design (「」 and ？ are part of the
  # product, not typos in an English codebase).
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"adapters/*/stop_hook.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["detector.py", "hookctl.py", "__init__.py", "adapters/_common.py"]

[[tool.mypy.overrides]]
module = ["adapters.*"]
ignore_errors = true
