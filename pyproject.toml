[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-continue-hook"
version = "1.3.0"
description = "Hermes Agent plugin: stop asking permission for things the agent should just do"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["hermes", "hermes-agent", "plugin", "agent", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ttxs69/hermes-continue-hook"
Issues = "https://github.com/ttxs69/hermes-continue-hook/issues"

[tool.setuptools]
py-modules = ["detector", "hookctl"]

[tool.setuptools.package-data]
"*" = ["plugin.yaml", "patch-mode/*", "agent-hooks/*", "adapters/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["adapters/dsh", ".venv", "build", "dist"]

[tool.ruff.format]
# patch-mode/continue_hook.py is generated by concatenating the engine; its
# spacing follows the assembly, not the formatter. It is still linted.
exclude = ["patch-mode/continue_hook.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "C90", "RUF"]
ignore = [
  "E501",    # long lines are handled by the formatter
  "SIM105",  # contextlib.suppress is slower than try/except here
  "B008",
  # The trigger patterns are Chinese by design (「」 and ？ are part of the
  # product, not typos in an English codebase).
  "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity ceiling.
#
# Measured before the gate went in: 17 (the plugin entry point), 16 (the
# transcript reader), 14 (the decision service). All of them were a decision
# table, a parse, or a cap check written as a chain of branches — the fix was
# to move the decision into a pure function and leave the shell to carry it
# out, not to sprinkle `noqa` over it.
#
# The ceiling is 10 and the highest function left in the shipped code is 9
# (`_decide_locked`). The headroom is deliberate: a ladder with six outcomes
# is still a ladder, and the next one should be a table.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"adapters/*/stop_hook.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "."
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
files = ["detector.py", "hookctl.py", "__init__.py", "adapters/_common.py", "adapters/*/stop_hook.py"]


[tool.pytest.ini_options]
# The suite is stdlib unittest so it runs with no dependencies; pytest is the
# runner we use for coverage and for its assertion output. Both must pass.
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "node_modules/*", ".venv/*"]

[tool.coverage.report]
# Measured: detector 84%, hookctl 94%, __init__ 76%, _common 69%, patch-mode
# 71% — 79% overall. The floor sits a point under that so it catches a
# regression without failing on a defensive branch someone adds tomorrow.
fail_under = 78
skip_covered = true

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]
