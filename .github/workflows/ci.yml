name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade pip ruff mypy
      # ruff check includes C901 (cyclomatic complexity, ceiling 10).
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy

  ts:
    name: eslint & tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install lint tooling
        run: npm install --no-package-lock --no-audit --no-fund
      # eslint includes the complexity rule (ceiling 10) for the shipped JS/TS.
      - name: eslint
        run: npx eslint .
      - name: prettier
        run: npx prettier --check '**/*.{js,mjs,ts,json,yml}'
      - name: tsc (Pi extension, strict)
        run: npx tsc -p tsconfig.json
      - name: tsc (JavaScript, checkJs)
        run: npx tsc -p tsconfig.checkjs.json

  coverage:
    name: pytest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip pytest pytest-cov ruff
      - name: pytest with the coverage floor
        run: pytest --cov --cov-report=term-missing

  node18-cli:
    name: node 18 — the shipped CLI still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      # No dev dependencies on this one: engines says >=18, so a plain `node`
      # must be enough to load and run the installer.
      - name: --help parses
        run: node bin/continue-hook.js --help
      - name: check --json is valid JSON
        run: |
          set +e
          node bin/continue-hook.js check --json > /tmp/check.json
          # exit 1 means "not installed anywhere", which is correct on a clean
          # runner; what this job proves is that node 18 can run the CLI at all.
          node -e 'const s=require("fs").readFileSync("/tmp/check.json","utf8"); const v=JSON.parse(s); if(!Array.isArray(v)) process.exit(1)'
      - name: install then uninstall in a throwaway HOME
        run: |
          export HOME=$(mktemp -d)
          node bin/continue-hook.js install --host claude-code
          node bin/continue-hook.js uninstall --host all
          test ! -e "$HOME/.hermes/continue-hook"

  js-coverage:
    name: vitest + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tooling
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Vitest with the coverage floor
        run: npx vitest run --coverage
      # The TypeScript half of the complexity gate is a Python test (it reads
      # eslint.config.mjs and runs eslint), so it needs a Python runner. This
      # job has both.
      - name: The complexity gate (TypeScript half)
        run: python -m unittest discover -s tests -p 'test_complexity*' -v

  python:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # ruff is needed by the complexity-gate test; without it that test
      # skips and the Python half of the gate is never checked here.
      - name: Install ruff
        run: pip install ruff
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  node:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest 5 needs ^22.12 || ^24 || >=26. The shipped CLI still supports
        # 18 (see the node18-cli job below); the dev toolchain does not.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dev tooling
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Vitest (OpenCode plugin, installer, lifecycle invariants)
        run: npx vitest run

  dsh:
    name: dsh plugin (typecheck + runtime)
    runs-on: ubuntu-latest
    # No continue-on-error: the fixture once installed no decision service, so
    # every "no nudge" case passed for the wrong reason and the whole job was
    # green while the plugin could never have fired.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test runner
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Typecheck the dsh plugin against the real dsh packages
        run: bash adapters/dsh/typecheck.sh
      - name: Run the dsh plugin against a mock harness
        run: npx vitest run tests/test_dsh.test.mjs

  package:
    name: npm package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pack the tarball
        run: npm pack --dry-run
      - name: Check the tarball carries the runtime
        run: |
          set -euo pipefail
          # `npm pack --json` must be the only thing on stdout — a prepack
          # script that prints there would break the JSON.
          npm pack --json > pack.json
          node -e "JSON.parse(require('fs').readFileSync('pack.json','utf8'))"
          files=$(node -e "const p=require('./pack.json');console.log(p[0].files.map(f=>f.path).join('\n'))")
          echo "$files" | grep -q "bin/continue-hook.js"
          echo "$files" | grep -q "hookctl.py"
          echo "$files" | grep -q "detector.py"
          echo "$files" | grep -q "skills/continue-hook/SKILL.md"
          echo "$files" | grep -q "adapters/claude-code/stop_hook.py"
          echo "$files" | grep -q "adapters/opencode/continue-hook.js"
          echo "$files" | grep -q "adapters/pi/continue-hook.ts"
          echo "$files" | grep -q "adapters/dsh/src/index.ts"
          # no build artefacts may ship
          if echo "$files" | grep -qE "__pycache__|\.pyc$"; then
            echo "::error::the tarball contains build artefacts"
            exit 1
          fi
