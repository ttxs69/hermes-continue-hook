name: Publish

# ── How publishing works here (2026 rules) ───────────────────────────────────
# npm's rules changed twice in 2026, and both changes matter for a first
# release:
#
#  1. **Trusted publishing (OIDC) is the way.** The npm CLI exchanges the
#     workflow's OIDC token for a short-lived registry token, so no long-lived
#     secret sits in the repository. Requirements (npm docs):
#       * npm CLI 11.5.1+  →  `npm install -g npm@latest` below
#       * Node 22.14.0+    →  node-version 24 below
#       * `id-token: write` permission  →  set at workflow level
#       * a *public* repository and a public package  →  provenance is
#         generated automatically, no `--provenance` flag needed
#       * the package's `repository.url` must match the GitHub repo exactly
#         →  it does (see package.json)
#       * GitHub-hosted runners only — self-hosted is not supported
#
#  2. **Staged publishing exists.** `npm stage publish` uploads a version to a
#     staging area; a maintainer approves it with 2FA and *then* it goes live.
#     This matters for a *new* package: npm publishes a placeholder version
#     `0.0.0-stage` so the package exists, which is what makes the trusted
#     publisher configurable at all (npm requires the package to exist before
#     a trusted publisher can be set for it).
#
# So the intended sequence for the first release is:
#
#   a. npm login (2-hour session) + 2FA on the account
#   b. npm stage publish            → creates the package (0.0.0-stage)
#   c. npm stage approve <id>       → 2FA; 1.3.0 goes live
#   d. npm trust github ... --allow-publish
#      → from now on this workflow needs no secret at all
#   e. gh secret delete NPM_TOKEN
#
# Steps b and c are one-time. The workflow below then publishes straight to
# the registry with OIDC, and every later release is a tag push.
#
# The `environment: npm` on the publish job is part of the trusted-publisher
# identity: the environment name has to match what npm has on file, exactly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "pack only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  version-gate:
    name: tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          # The tag must match the version when the workflow is triggered by a
          # tag. A manual run has no tag to match — it just publishes the
          # version in package.json.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version-gate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm >= 11.5.1, which is what OIDC publishing needs.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build: a poisoned cache entry would be
          # published. npm's own docs say the same.
          package-manager-cache: false
      - name: Use a current npm (11.5.1+ for trusted publishing, 11.15.0+ for staging)
        run: npm install -g npm@latest
      - name: Check what is already published
        run: |
          npm view hermes-continue-hook versions --json || echo "not published yet"
      - name: Pack and show the contents
        run: npm pack --dry-run
      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org/
      - name: Publish
        if: ${{ inputs.dry-run != true }}
        # --registry is explicit on purpose: a machine-level .npmrc pointing at
        # a registry mirror would otherwise publish into the mirror. npm's
        # trusted publishing (OIDC) also derives its audience from the
        # registry host, so the audience must be registry.npmjs.org.
        #
        # --provenance is not passed: with trusted publishing npm generates the
        # attestation automatically (public repo + public package). Passing it
        # by hand is only needed for the token path.
        run: npm publish --access public --registry=https://registry.npmjs.org/
        env:
          # Empty when trusted publishing is configured — npm then uses OIDC.
          # Only the *first* publish needs this, and only until step (d) of
          # the header comment has been done.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
