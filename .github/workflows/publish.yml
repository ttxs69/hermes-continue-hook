name: Publish

# ── How publishing works here (2026 rules) ───────────────────────────────────
# npm's rules changed twice in 2026, and both changes matter for a first
# release:
#
#  1. **Trusted publishing (OIDC) is the way.** The npm CLI exchanges the
#     workflow's OIDC token for a short-lived registry token, so no long-lived
#     secret sits in the repository. Requirements (npm docs):
#       * npm CLI 11.5.1+  →  `npm install -g npm@latest` below
#       * Node 22.14.0+    →  node-version 24 below
#       * `id-token: write` permission  →  set at workflow level
#       * a *public* repository and a public package  →  provenance is
#         generated automatically, no `--provenance` flag needed
#       * the package's `repository.url` must match the GitHub repo exactly
#         →  it does (see package.json)
#       * GitHub-hosted runners only — self-hosted is not supported
#
#  2. **Staged publishing exists.** `npm stage publish` uploads a version to a
#     staging area; a maintainer approves it with 2FA and *then* it goes live.
#     This matters for a *new* package: npm publishes a placeholder version
#     `0.0.0-stage` so the package exists, which is what makes the trusted
#     publisher configurable at all (npm requires the package to exist before
#     a trusted publisher can be set for it).
#
# ── The first release needs a token ──────────────────────────────────────────
# npm's trusted publishing (OIDC) refuses to publish a package that does not
# exist yet — the npm trust docs, the registry API spec and the OIDC exchange
# endpoint all say "the package must exist". So the first release needs a
# credential, and only the first one.
#
# That credential has to be a **bypass-2FA** granular access token. Measured
# against the registry: a token with `bypass_2fa: false` is rejected on a
# direct publish with 401 "You must provide a one-time pass" — the account has
# 2FA on and CI has nobody to answer the prompt. A bypass-2FA token publishes
# without the prompt.
#
# (npm is removing bypass-2FA *direct publish* in January 2027. The token is
# therefore short-lived by design, and the trusted publisher takes over right
# after the first release — see the sequence below.)
#
# So the sequence for the first release is:
#
#   a. create a bypass-2FA granular access token (read+write, short life)
#   b. gh secret set NPM_TOKEN       → the token, in the repository's secrets
#   c. push the v1.3.0 tag           → this workflow publishes it
#   d. npm trust github ... --allow-publish
#      → from now on this workflow needs no secret at all
#   e. gh secret delete NPM_TOKEN
#
# Steps a–c are one-time. After the trusted publisher exists, every later
# release is a tag push and a direct publish — OIDC authenticates by workflow
# identity, so no token and no 2FA prompt are involved.
#
# The workflow below publishes directly, and falls back to staging if the
# registry refuses the direct publish (a token without bypass 2FA). Staging
# never needs 2FA; only the approval does.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "pack only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for npm provenance / trusted publishing

jobs:
  version-gate:
    name: tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: gate
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          # The tag must match the version when the workflow is triggered by a
          # tag. A manual run has no tag to match — it just publishes the
          # version in package.json.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version-gate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm >= 11.5.1, which is what OIDC publishing needs.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # Never cache in a release build: a poisoned cache entry would be
          # published. npm's own docs say the same.
          package-manager-cache: false
      - name: Use a current npm (11.5.1+ for trusted publishing, 11.15.0+ for staging)
        run: npm install -g npm@latest
      - name: Check what is already published
        run: |
          npm view @ttxs69/hermes-continue-hook versions --json || echo "not published yet"
      - name: Pack and show the contents
        run: npm pack --dry-run
      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org/
      # ── Publish, with a staging fallback ───────────────────────────────────
      # --registry is explicit on purpose: a machine-level .npmrc pointing at
      # a registry mirror would otherwise publish into the mirror. npm's
      # trusted publishing (OIDC) also derives its audience from the
      # registry host, so the audience must be registry.npmjs.org.
      #
      # --provenance is passed explicitly, and it has to be: the attestation
      # is signed by sigstore with the *GitHub* OIDC id-token, which is
      # independent of how npm authenticates. npm only turns provenance on
      # by itself when it has just exchanged an OIDC token (npm's
      # lib/utils/oidc.js checks `config.isDefault('provenance')`), so the
      # token path — the first release — would ship without an attestation
      # if this flag were left off.
      - name: Publish
        if: ${{ inputs.dry-run != true }}
        run: |
          if npm publish --access public --provenance --registry=https://registry.npmjs.org/; then
            echo "::notice::Published."
          else
            # A token without bypass 2FA cannot publish unattended: the
            # registry answers 401 "You must provide a one-time pass". Staging
            # needs no 2FA — only the approval does — so it is the way to get
            # the package onto the registry without a human in the loop.
            echo "::warning::Direct publish was refused. Staging instead — it needs no 2FA."
            npm stage publish --access public --provenance --registry=https://registry.npmjs.org/
            echo
            echo "::notice::Staged. Publish it with your 2FA:"
            echo "::notice::  npm stage list --registry=https://registry.npmjs.org/"
            echo "::notice::  npm stage approve <stage-id> --registry=https://registry.npmjs.org/"
          fi
        env:
          # Empty when trusted publishing is configured — npm then uses OIDC.
          # Only the *first* release needs this, and only until step (e) of
          # the header comment has been done.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
