name: Publish

# Publishing is tag-driven: push a vX.Y.Z tag whose name matches the version
# in package.json, and this workflow publishes to npm.
#
# ── How the npm credentials work ────────────────────────────────────────────
# npm's *trusted publishing* (OIDC) is used when it is available: npm CLI
# 11.5.1+ exchanges the workflow's OIDC token for a short-lived registry
# token, so no long-lived secret sits in the repository. Configure it once,
# after the package exists on npm:
#
#   npm trust hermes-continue-hook \
#     --repo ttxs69/hermes-continue-hook \
#     --file publish.yml \
#     --env npm \
#     --allow-publish
#
# The first publish of a *new* package cannot use OIDC — npm requires the
# package to already exist on the registry — so it needs an automation token
# in the `NPM_TOKEN` secret. After that one publish, trusted publishing takes
# over and the secret can be removed.
#
# Provenance needs: npm CLI >= 9.5.0, a cloud-hosted runner, `id-token: write`
# (set below), and a public `repository` field in package.json that matches
# the publish location exactly.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "pack only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # required for npm provenance / trusted publishing

jobs:
  version-gate:
    name: tag matches the package version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          # The tag must match the version when the workflow is triggered by a
          # tag. A manual run has no tag to match — it just publishes the
          # version in package.json.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version-gate
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Use a current npm (11.5.1+ for trusted publishing)
        run: npm install -g npm@latest
      - name: Check what is already published
        run: |
          npm view hermes-continue-hook versions --json || echo "not published yet"
      - name: Pack and show the contents
        run: npm pack --dry-run
      - name: Dry run
        if: ${{ inputs.dry-run }}
        run: npm publish --dry-run --access public --registry=https://registry.npmjs.org/
      - name: Publish
        if: ${{ inputs.dry-run != true }}
        # --registry is explicit on purpose: a machine-level .npmrc pointing at
        # a registry mirror would otherwise publish into the mirror. npm's
        # trusted publishing (OIDC) also derives its audience from the
        # registry host, so the audience must be registry.npmjs.org.
        run: npm publish --access public --provenance --registry=https://registry.npmjs.org/
        env:
          # Empty when trusted publishing is configured — npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
